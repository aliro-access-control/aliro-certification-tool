[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "access_doc"
version = "0.1.0"
description = "Access Document utilities for Aliro Certification Tool"
authors = [
    {name = "Aliro Authors"}
]
license = {text = "Apache License 2.0"}
requires-python = ">=3.8"

dependencies = [
    "cbor2",
    "cryptography",
    "python-dateutil",
]

[tool.setuptools.packages.find]
where = ["."]  
include = ["access_doc*"]

